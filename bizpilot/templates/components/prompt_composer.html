{% from "components/icons.html" import icon %}
<div class="composer-wrap">
  <div class="typing-indicator" id="typingIndicator" hidden aria-live="polite">
    <span></span><span></span><span></span><small>BizPilot agents are reviewing your business data</small>
  </div>
  <form class="composer" id="chatForm">
    <div class="composer-input-row">
      <textarea id="chatInput" rows="1" maxlength="2000" placeholder="Ask BizPilot about your business..." aria-label="Business question"></textarea>
      <button class="icon-btn composer-clear" id="clearPromptButton" type="button" aria-label="Clear question" hidden>{{ icon('x') }}</button>
    </div>
    <div class="composer-footer">
      <span class="keyboard-hint">Enter to send · Shift + Enter for a new line</span>
      <span class="char-count" id="charCount">0 / 2000</span>
      <button class="send-btn" id="sendButton" type="submit" aria-label="Send question">{{ icon('send') }}</button>
    </div>
  </form>
  <p class="ai-disclaimer">{{ icon('sparkles') }} Answers are grounded in your saved business data and may need verification.</p>
</div>
