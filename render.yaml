# Render Deployment Blueprint for BizPilot AI (100% Free Tier)
# Instructions:
# 1. Connect repository in Render Dashboard -> Blueprints.
# 2. Render will automatically create the PostgreSQL database and Web Service.
# 3. Add secrets (GEMINI_API_KEY, GROQ_API_KEY) in the Web Service Environment panel.
# 4. Free tier services sleep after 15 min of inactivity. To keep background scheduler alive,
#    set up UptimeRobot (free) to ping https://your-app.onrender.com/api/health every 5 minutes.

services:
  - type: web
    name: bizpilot-ai
    env: docker
    plan: free
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: bizpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: PRIMARY_AI_PROVIDER
        value: gemini
      - key: FALLBACK_AI_PROVIDER
        value: groq
      - key: ENABLE_RULE_BASED_FALLBACK
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: bizpilot-db
    plan: free
    databaseName: bizpilot
    user: bizpilot_user
