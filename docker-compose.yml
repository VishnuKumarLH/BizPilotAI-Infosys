services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizpilot-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bizpilot
      - SECRET_KEY=production-secret-key-change-me
      - API_KEY=bizpilot-secret-api-key
      - FLASK_DEBUG=false
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: bizpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bizpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bizpilot_postgres_data:
