services:
  db:
    image: postgres:17-alpine
    container_name: bizpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizpilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - bizpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bizpilot_postgres_data:

